services:
  web:
    image: node:22-bookworm
    working_dir: /app
    init: true
    restart: on-failure
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_AUTH_ENABLED: "false"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/', {signal: AbortSignal.timeout(8000)}).then(async r => {if (!r.ok || !(await r.text()).includes('/@id/virtual:tanstack-start-dev-client-entry')) throw new Error('Web app did not serve live source');}).catch(e => {console.error(e.message); process.exit(1);})"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
